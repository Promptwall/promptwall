name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command, the policy (shortened to what matters) and the request. Leave out real keys and personal data.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `promptwall --version`, or the npm package version, and your OS.
    validations: { required: true }
