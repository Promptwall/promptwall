name: CLA

# Asks first-time contributors to sign CLA.md by posting a comment on their
# pull request. Signatures are stored in signatures/cla.json on the
# cla-signatures branch, which the action creates on first use.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Promptwall/promptwall/blob/main/CLA.md
          branch: cla-signatures
          allowlist: marvinthl,claude,dependabot[bot],github-actions[bot]
