name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  light:
    name: Build without models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The build without ONNX Runtime (for platforms it does not support) must
      # keep compiling and pass every test that needs no model.
      - run: cargo clippy -p promptwall -p promptwall-classify --no-default-features --all-targets -- -D warnings
      - run: cargo test -p promptwall -p promptwall-classify --no-default-features

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the WebAssembly module
        working-directory: packages/sdk
        run: npm run build
      - name: Build the server for the check API test
        run: cargo build -p promptwall --no-default-features
      - name: Test
        working-directory: packages/sdk
        run: npm test
        env:
          PROMPTWALL_BIN: ${{ github.workspace }}/target/debug/promptwall
      - name: Package contents
        working-directory: packages/sdk
        run: npm pack --dry-run --ignore-scripts

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/promptwall
      - name: Render with every option on
        run: |
          helm template pw deploy/helm/promptwall \
            --set metrics.enabled=true --set decisionLog.enabled=true \
            --set policySigning.publicKey=dGVzdA== --set models.existingClaim=models \
            --set models.injection=true --set models.pii=true > /dev/null

  latency:
    name: Latency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The release build links the ONNX Runtime that ort downloads into
      # ~/.cache/ort.pyke.io. Cache it with target/: a restored ort-sys build
      # that points at a download missing on the new runner fails to link.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ort
          cache-directories: ~/.cache/ort.pyke.io
      # Shared CI runners are noisy, so the gate here is looser than the
      # 2 ms pass-through target in docs/specs/benchmark.md.
      - name: Pass-through
        run: scripts/bench.sh --rate 200 --duration 10 --max-p95-added-ms 5
      - name: With PII and secret detection
        run: scripts/bench.sh --rate 200 --duration 10 --max-p95-added-ms 5
        env:
          BENCH_POLICY: scripts/bench-policy.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t promptwall:ci .
      - name: Smoke test
        run: |
          docker run --rm promptwall:ci --version
          docker run --rm --entrypoint pw-mock-upstream promptwall:ci --help
