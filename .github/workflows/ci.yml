name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  latency:
    name: Latency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Shared CI runners are noisy, so the gate here is looser than the
      # 2 ms pass-through target in docs/specs/benchmark.md.
      - name: Pass-through
        run: scripts/bench.sh --rate 200 --duration 10 --max-p95-added-ms 5
      - name: With PII and secret detection
        run: scripts/bench.sh --rate 200 --duration 10 --max-p95-added-ms 5
        env:
          BENCH_POLICY: scripts/bench-policy.yaml
