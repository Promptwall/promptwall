name: Release

# Pushing a tag such as v0.1.0 builds the downloads, publishes them as a
# GitHub release, pushes the Docker image to ghcr.io and publishes the npm
# package (needs the NPM_TOKEN secret: an npm automation token with publish
# rights on the @promptwall-ai scope). Running it by hand
# (Actions, Release, Run workflow) only builds, to check that every platform
# still compiles; nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - id: plan
        # GitHub's arm64 Linux runners are free for public repositories only,
        # so a private repository builds Linux for x86_64 alone.
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          linux_x64='{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","docker":"amd64"}'
          linux_arm='{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","docker":"arm64"}'
          mac='{"target":"aarch64-apple-darwin","os":"macos-15"}'
          windows='{"target":"x86_64-pc-windows-msvc","os":"windows-2022"}'
          if [ "$PRIVATE" = "true" ]; then
            echo "matrix={\"include\":[$linux_x64,$mac,$windows]}" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux_x64,$linux_arm,$mac,$windows]}" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches every version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p promptwall -p pw-mock-upstream
      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/promptwall
          $bin --version
          $bin validate --policy examples/policy.yaml
          $bin test --policy examples/policy.yaml
      - name: Package
        shell: bash
        run: |
          name=promptwall-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/promptwall$ext" "dist/$name/"
          cp LICENSE README.md examples/policy.yaml "dist/$name/"
          cd dist
          if [[ -n "$ext" ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - name: Keep the Linux binaries for the Docker image
        if: matrix.docker
        shell: bash
        run: |
          mkdir -p "docker/${{ matrix.docker }}"
          cp target/${{ matrix.target }}/release/promptwall target/${{ matrix.target }}/release/pw-mock-upstream "docker/${{ matrix.docker }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: matrix.docker
        with:
          name: docker-${{ matrix.docker }}
          path: docker/

  publish:
    name: Publish
    needs: [plan, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          path: docker
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.release
          platforms: ${{ needs.plan.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0

  npm:
    name: Publish the npm package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance: links the package to this build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Build and test
        working-directory: packages/sdk
        run: |
          npm run build
          cargo build -p promptwall --no-default-features
          PROMPTWALL_BIN="$GITHUB_WORKSPACE/target/debug/promptwall" npm test
      - name: Publish
        working-directory: packages/sdk
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
