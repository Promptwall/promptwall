# Attacks and evasions that the pattern checks (Tier 1) must keep catching,
# and ordinary text they must let through. CI runs it (crates/proxy/tests/attacks.rs);
# so can anyone:  promptwall test --policy tests/attack-corpus.yaml
# Add a case for every bypass that gets fixed. Known gaps: docs/specs/threat-model.md.
version: 1
upstreams:
  provider: { url: "https://api.openai.com" }
routes:
  - name: strict
    upstream: provider
    input:
      - { detector: prompt_injection, action: block }
      - { detector: secrets, action: block }
      - { detector: pii, action: redact }
    output:
      - { detector: secrets, action: block }
      - { detector: pii, action: redact }
      - { detector: exfiltration, action: block }
