[package]
name = "promptwall"
description = "Open source AI firewall: a low-latency proxy between apps and LLM providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util = { version = "0.3", default-features = false }
clap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
schemars.workspace = true
hyper-util.workspace = true
promptwall-classify = { path = "../classify", default-features = false }
promptwall-detect = { path = "../detect" }
promptwall-engine = { path = "../engine" }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["models"]
# Tier 2 models (--injection-model and the others) with ONNX Runtime. Without
# it, every other check works and the binary needs no ONNX Runtime library.
models = ["promptwall-classify/onnx"]

[dev-dependencies]
pw-mock-upstream = { path = "../mock-upstream" }
