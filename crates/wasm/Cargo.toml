[package]
name = "promptwall-wasm"
description = "The Promptwall policy engine as a WebAssembly module, for the npm package"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No PDF reader, to keep the npm package small. PDFs count as
# files that cannot be read.
promptwall-engine = { path = "../engine", default-features = false }
serde.workspace = true
serde_json.workspace = true
