[package]
name = "promptwall-classify"
description = "Promptwall Tier 2 detectors: small text classifiers on CPU with ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
ort = { version = "=2.0.0-rc.10", optional = true }
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = ["onnx"]
# ONNX Runtime and the tokenizer, for the Tier 2 models.
onnx = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
promptwall-detect = { path = "../detect" }
