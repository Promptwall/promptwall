{{- if not .Values.existingPolicyConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promptwall.policyConfigMap" . }}
  labels:
    {{- include "promptwall.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- .Values.policy | nindent 4 }}
  {{- with .Values.policySigning.signature }}
  policy.yaml.sig: {{ . | trim | quote }}
  {{- end }}
{{- end }}
{{- with .Values.policySigning.publicKey }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promptwall.fullname" $ }}-policy-key
  labels:
    {{- include "promptwall.labels" $ | nindent 4 }}
data:
  policy.pub: {{ . | trim | quote }}
{{- end }}
