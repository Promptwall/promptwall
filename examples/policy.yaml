# Example Promptwall policy. Run with:
#   promptwall --policy examples/policy.yaml
# and, to add the Tier 2 injection classifier (see docs/models.md):
#   promptwall --policy examples/policy.yaml --injection-model models/injection
# (--safety-model, --topic-model and --pii-model add the other Tier 2 models).
# Format: docs/specs/policy-format.md
version: 1

defaults:
  fail_mode: open   # forward requests that cannot be inspected (compressed, over 4 MiB)
  shadow: false     # set to true to only log what would happen

upstreams:
  openai:
    url: https://api.openai.com
  anthropic:
    url: https://api.anthropic.com

routes:
  - name: anthropic
    match:
      path: /v1/messages
    upstream: anthropic
    input:
      # Tier 1 patterns always; the classifier too when a model is loaded.
      - detector: prompt_injection
        action: block
      - detector: secrets
        action: block
      - detector: pii
        action: redact
      # With --safety-model and --topic-model (see docs/models.md):
      # - detector: content_safety
      #   threshold: 0.8
      #   action: block
      # - detector: topics
      #   deny: [politics, medical advice]
      #   action: block
      # With --pii-model: names and addresses (see docs/models.md):
      # - detector: pii
      #   entities: [person, street_address, postcode]
      #   action: redact

  - name: openai
    upstream: openai
    fail_mode: closed
    input:
      - detector: secrets
        action: block
      - detector: pii
        entities: [email, iban, credit_card, vat_id, de_tax_id, it_fiscal_code, es_dni, fr_nir]
        action: redact
      - detector: pii
        action: flag
      # Company-specific data: a pattern and a keyword list.
      - detector: custom
        name: employee_id
        pattern: 'EMP-[0-9]{6}'
        action: redact
      - detector: custom
        name: project_names
        keywords: [Project Falcon]
        action: block
    # Checks on the answer, including streamed answers.
    output:
      - detector: secrets
        action: block
      - detector: pii
        entities: [email, iban, credit_card]
        action: redact
      # Images and links that would carry conversation data to another server.
      - detector: exfiltration
        allow_domains: [openai.com]
        action: block
      # The answer repeats ten or more words of the system prompt.
      - detector: system_prompt_leak
        action: block
    # Tools the model may use, and limits on their arguments.
    tools:
      allow: [get_weather, search_docs, send_email]
      action: block
      arguments:
        - tool: send_email
          field: to
          allow: ['*@example.com']
