[package]
name = "promptwall-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
promptwall-detect = { path = "../crates/detect" }
promptwall-engine = { path = "../crates/engine" }
promptwall-wasm = { path = "../crates/wasm" }
serde_json = "1"

# Not part of the workspace: it needs nightly Rust and cargo-fuzz.
[workspace]

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inspect"
path = "fuzz_targets/inspect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy"
path = "fuzz_targets/policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm_call"
path = "fuzz_targets/wasm_call.rs"
test = false
doc = false
bench = false
